name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v2.0.3-desktop)'
        required: false
        default: 'v2.0.3-desktop'
  release:
    types: [published]
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            builder_args: --linux --x64
          - os: windows-latest
            platform: win
            builder_args: --win --x64
          - os: macos-latest
            platform: mac
            builder_args: --mac --x64 --arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app-desktop/package-lock.json

      - name: Install dependencies
        working-directory: app-desktop
        run: npm ci

      - name: Build Desktop Application
        working-directory: app-desktop
        run: npm run build

      - name: Package with Electron Builder
        working-directory: app-desktop
        run: npx electron-builder ${{ matrix.builder_args }} --publish never
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: emufii-desktop-${{ matrix.platform }}
          path: |
            app-desktop/release/*.AppImage
            app-desktop/release/*.deb
            app-desktop/release/*.tar.gz
            app-desktop/release/*.exe
            app-desktop/release/*.dmg
            app-desktop/release/*.zip
          if-no-files-found: warn

      - name: Publish Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: Emufii Desktop ${{ github.event.inputs.version || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            app-desktop/release/*.AppImage
            app-desktop/release/*.deb
            app-desktop/release/*.tar.gz
            app-desktop/release/*.exe
            app-desktop/release/*.dmg
            app-desktop/release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
